<div id="credential-form-modal"
     class="form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="credential-form-modal-title">
    <button type="button"
            class="form-modal__backdrop"
            popovertarget="credential-form-modal"
            popovertargetaction="hide"
            aria-label="Close credential form"></button>
    <div class="form-modal__content">
        <button type="button"
                class="form-modal__close"
                popovertarget="credential-form-modal"
                popovertargetaction="hide"
                aria-label="Close credential form">×</button>
        <h2 id="credential-form-modal-title">Add a Credential</h2>
        <form id="credential-form" class="custom-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="credential-title">Title</label>
                <input id="credential-title" name="title" required>
            </div>
            <div class="form-group">
                <label for="credential-description">Description</label>
                <textarea id="credential-description" name="description" required></textarea>
            </div>
            <div class="form-group">
                <label for="credential-category">Category</label>
                <select id="credential-category" name="category" required>
                    <option value="certification">Certification</option>
                    <option value="competition">Competition</option>
                    <option value="award">Award</option>
                    <option value="scholarship">Scholarship</option>
                </select>
            </div>
            <div class="form-group">
                <label for="credential-issuer">Issuer</label>
                <input id="credential-issuer" name="issuer" required>
            </div>
            <div class="form-group">
                <label for="credential-date-received">Date received</label>
                <input id="credential-date-received"
                       name="date_received"
                       type="date"
                       required>
            </div>
            <div class="form-group">
                <label for="credential-expiry-date">Expiry date</label>
                <input id="credential-expiry-date" name="expiry_date" type="date">
            </div>
            <div class="form-group">
                <label for="credential-url">Verification URL</label>
                <input id="credential-url" name="credential_url" type="url">
            </div>
            <div class="form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="credential-form-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Credential</button>
            </div>
        </form>
    </div>
</div>
