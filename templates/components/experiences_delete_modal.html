<button
  type="button"
  class="button button-danger"
  popovertarget="delete-experience-{{ experience.id }}"
  aria-label="Remove {{ experience.title }}"
  title="Remove experience"
>
  Remove Experience
</button>
<div
  id="delete-experience-{{ experience.id }}"
  class="delete-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-experience-title-{{ experience.id }}"
>
  <button
    type="button"
    class="delete-modal__backdrop"
    popovertarget="delete-experience-{{ experience.id }}"
    popovertargetaction="hide"
    aria-label="Close remove confirmation"
  ></button>
  <div class="delete-modal__content">
    <button
      type="button"
      class="delete-modal__close"
      popovertarget="delete-experience-{{ experience.id }}"
      popovertargetaction="hide"
      aria-label="Close remove confirmation"
    >
      ×
    </button>
    <h2 id="delete-experience-title-{{ experience.id }}">Remove Experience?</h2>
    <p>
      Are you sure you want to remove this experience?
      <strong>{{ experience.title }}</strong>?
    </p>
    <div class="delete-modal__actions">
      <button
        type="button"
        class="button button-secondary"
        popovertarget="delete-experience-{{ experience.id }}"
        popovertargetaction="hide"
      >
        Cancel
      </button>
      <form
        method="post"
        action="{% url 'main:delete_experiences' experience.id %}"
      >
        {% csrf_token %}
        <button type="submit" class="button button-danger">Yes, remove</button>
      </form>
    </div>
  </div>
</div>
