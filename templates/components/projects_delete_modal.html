<button type="button" class="button button-danger" popovertarget="delete-project-{{ project.id }}"
	aria-label="Remove {{ project.title }}" title="Remove project">
	Remove Project
</button>
<div id="delete-project-{{ project.id }}" class="delete-modal" popover="auto" role="dialog" aria-modal="true"
	aria-labelledby="delete-project-title-{{ project.id }}">
	<button type="button" class="delete-modal__backdrop" popovertarget="delete-project-{{ project.id }}"
		popovertargetaction="hide" aria-label="Close remove confirmation"></button>
	<div class="delete-modal__content">
		<button type="button" class="delete-modal__close" popovertarget="delete-project-{{ project.id }}"
			popovertargetaction="hide" aria-label="Close remove confirmation">
			×
		</button>
		<h2 id="delete-project-title-{{ project.id }}">Remove Project?</h2>
		<p>
			Are you sure you want to remove this project?
			<strong>{{ project.title }}</strong>?
		</p>
		<div class="delete-modal__actions">
			<button type="button" class="button button-secondary" popovertarget="delete-project-{{ project.id }}"
				popovertargetaction="hide">
				Cancel
			</button>
			<form method="post" action="{% url 'main:delete_project' project.id %}">
				{% csrf_token %}
				<button type="submit" class="button button-danger">Yes, remove</button>
			</form>
		</div>
	</div>
</div>
