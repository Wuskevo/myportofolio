<button type="button" class="button button-danger" popovertarget="delete-credential-{{ credential.id }}"
	aria-label="Remove {{ credential.title }}" title="Remove credential">
	Remove Credential
</button>
<div id="delete-credential-{{ credential.id }}" class="delete-modal" popover="auto" role="dialog" aria-modal="true"
	aria-labelledby="delete-credential-title-{{ credential.id }}">
	<button type="button" class="delete-modal__backdrop" popovertarget="delete-credential-{{ credential.id }}"
		popovertargetaction="hide" aria-label="Close remove confirmation"></button>
	<div class="delete-modal__content">
		<button type="button" class="delete-modal__close" popovertarget="delete-credential-{{ credential.id }}"
			popovertargetaction="hide" aria-label="Close remove confirmation">
			&times;
		</button>
		<h2 id="delete-credential-title-{{ credential.id }}">Remove Credential?</h2>
		<p>
			Are you sure you want to remove this credential?
			<strong>{{ credential.title }}</strong>?
		</p>
		<div class="delete-modal__actions">
			<button type="button" class="button button-secondary" popovertarget="delete-credential-{{ credential.id }}"
				popovertargetaction="hide">
				Cancel
			</button>
			<form method="post" action="{% url 'main:delete_credentials' credential.id %}">
				{% csrf_token %}
				<button type="submit" class="button button-danger">Yes, remove</button>
			</form>
		</div>
	</div>
</div>
