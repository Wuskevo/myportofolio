{% if user.is_authenticated %}
<form method="post" action="{% url 'main:toggle_project_star' project.id %}" class="star-form">
	{% csrf_token %}
	<button type="submit" class="button button-star{% if user in project.starred_by.all %} is_starred{% endif %}"
		title="{% if project.starred_by.all %}Starred by {{ project.starred_by.all|join:', '}}{% else %}Be the first to star{% endif %}">
		<span aria-hidden="true">★</span>
		{% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %}
		<span class="star-count">{{ project.starred_by.count }}</span>
	</button>
</form>
{% else %}
<span class="star-count" aria-label="Star count">★ {{ project.starred_by.count }}</span>
{% endif %}
